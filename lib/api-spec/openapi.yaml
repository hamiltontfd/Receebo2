openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: receipts
    description: Receipt storage, search, and retrieval
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /billing/trial-funnel:
    post:
      operationId: recordTrialFunnelInteraction
      summary: Record an authenticated paywall view or checkout cancellation, without user content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialFunnelInteraction"
      responses:
        "204":
          description: Interaction handled idempotently, or account outside the no-card cohort
        "400":
          description: Invalid interaction
        "401":
          description: Authentication required
  /billing/start-trial:
    post:
      operationId: startAccountTrial
      summary: Start the seven-day no-card account trial once after legal consent
      responses:
        "200":
          description: Trial initialized or existing entitlement preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTrialStartResult"
        "428":
          description: Legal acceptance required
  /storage/uploads/release:
    post:
      operationId: releaseUploadReservation
      summary: Release an unconsumed failed upload transfer without restoring successful uses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadReservationRelease"
      responses:
        "204":
          description: Unconsumed reservation released
  /billing/subscription:
    get:
      operationId: fetchBillingAccessStatus
      summary: Current authenticated user's subscription and complimentary access
      responses:
        "200":
          description: Server-verified product entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingAccessStatus"
        "401":
          description: Authentication required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      summary: List receipts (most recent first)
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Natural-language search query across merchant, products, OCR text, and AI metadata.
      responses:
        "200":
          description: List of receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Create a receipt from an uploaded file and trigger AI extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "201":
          description: Created receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /receipts/stats:
    get:
      operationId: getReceiptStats
      tags: [receipts]
      summary: Aggregate stats for the current user's receipts
      responses:
        "200":
          description: Receipt statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptStats"
  /receipts/recent:
    get:
      operationId: getRecentReceipts
      tags: [receipts]
      summary: A small set of the most recent receipts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
          description: Number of recent receipts to return (default 5).
      responses:
        "200":
          description: Recent receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
  /receipts/merchant-breakdown:
    get:
      operationId: getMerchantBreakdown
      tags: [receipts]
      summary: Spend grouped by merchant
      responses:
        "200":
          description: Merchant spend breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchantSpend"
  /receipts/check-similar:
    get:
      operationId: checkSimilarReceipt
      tags: [receipts]
      summary: Check if a receipt with matching merchant, date, and total already exists
      description: |
        Returns a list of non-draft completed receipts for the authenticated user
        that exactly match the given merchant, purchaseDate, and total.
        Used to warn the user before saving a potentially duplicate receipt.
      parameters:
        - name: merchant
          in: query
          required: false
          schema:
            type: string
          description: Merchant name to match exactly.
        - name: purchaseDate
          in: query
          required: false
          schema:
            type: string
          description: Purchase date in YYYY-MM-DD format.
        - name: total
          in: query
          required: false
          schema:
            type: number
          description: Total amount to match exactly.
      responses:
        "200":
          description: List of similar receipts (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimilarReceiptMatch"
  /receipts/{id}:
    get:
      operationId: getReceipt
      tags: [receipts]
      summary: Get a single receipt with full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Receipt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateReceipt
      tags: [receipts]
      summary: Update editable receipt fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptUpdate"
      responses:
        "200":
          description: Updated receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteReceipt
      tags: [receipts]
      summary: Delete a receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /guest-session/claim:
    post:
      operationId: claimGuestSession
      tags: [receipts]
      summary: Migrate guest receipts to an authenticated user
      description: |
        Re-assigns all receipts owned by the given guest token to the currently
        authenticated Clerk user, then deletes the guest session. Safe to call
        unconditionally — returns 204 whether or not a guest token was found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestClaimBody"
      responses:
        "204":
          description: Migration complete (or no-op if token was absent/already claimed)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    TrialFunnelInteraction:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          type: string
          enum: [paywall_viewed, checkout_canceled]
        reason:
          type: string
          enum: [trial_expired, trial_exhausted]
        attemptId:
          type: string
          format: uuid
    AccountTrialStartResult:
      type: object
      required: [started]
      properties:
        started:
          type: boolean
    UploadReservationRelease:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
          minLength: 1
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Receipt:
      type: object
      required:
        - id
        - objectPath
        - originalFileName
        - contentType
        - status
        - createdAt
      properties:
        id:
          type: integer
        objectPath:
          type: string
          description: Storage path of the original uploaded file (e.g. /objects/uploads/uuid).
        originalFileName:
          type: string
        contentType:
          type: string
          description: MIME type of the uploaded original.
        status:
          type: string
          enum: [processing, completed, failed, not_a_receipt]
          description: AI extraction status.
        isDraft:
          type: boolean
          description: Draft receipts are pending user confirmation and excluded from the library.
        warranty:
          type: ["string", "null"]
          description: Warranty or return-policy information extracted from the receipt.
        merchant:
          type: ["string", "null"]
        purchaseDate:
          type: ["string", "null"]
          description: Purchase date in ISO format (YYYY-MM-DD).
        deliveryDate:
          type: ["string", "null"]
          description: Date the goods were delivered (YYYY-MM-DD), if known. Return windows count from it, else from the purchase date.
        total:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
          description: AI-generated natural-language summary of the receipt.
        ocrText:
          type: ["string", "null"]
          description: Full extracted text from the receipt.
        transactionNumber:
          type: ["string", "null"]
          description: Transaction or reference number from the receipt.
        purchaseCountry:
          type: ["string", "null"]
          description: ISO-3166-1 alpha-2 country code where the purchase was made (e.g. "PT", "US", "BR").
        isOnlinePurchase:
          type: ["boolean", "null"]
          description: True if this is an e-commerce/online/distance purchase.
        purchaseType:
          type: ["string", "null"]
          enum: [goods, subscription, digital, service, ticket, null]
          description: What was bought. Anything but goods (subscriptions, one-off digital purchases, event tickets, services) has no return window, no warranty dates and no reminders. Null = unknown (treated as goods).
        purchaseTypeSource:
          type: ["string", "null"]
          enum: [ai, hint, manual, null]
          description: Where purchaseType came from. A manual choice is never overwritten.
        products:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptProduct"
        notableItems:
          type: array
          description: Items flagged as notable (expensive or warranty-relevant).
          items:
            $ref: "#/components/schemas/NotableItem"
        createdAt:
          type: string
          format: date-time
    ReceiptProduct:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        quantity:
          type: ["number", "null"]
        price:
          type: ["number", "null"]
    ReceiptInput:
      type: object
      required:
        - objectPath
        - originalFileName
        - contentType
      properties:
        objectPath:
          type: string
          minLength: 1
          description: Storage path returned by the upload endpoint.
        originalFileName:
          type: string
          minLength: 1
        contentType:
          type: string
          minLength: 1
    NotableItem:
      type: object
      required:
        - name
        - reason
      properties:
        name:
          type: string
        price:
          type: ["number", "null"]
        category:
          type: ["string", "null"]
        reason:
          type: string
          description: One-line explanation of why this item is worth keeping the receipt for.
    ReceiptUpdate:
      type: object
      properties:
        isOnlinePurchase:
          type: ["boolean", "null"]
        purchaseType:
          type: ["string", "null"]
          enum: [goods, subscription, digital, service, ticket, null]
          description: Manual purchase type (the "This is a subscription" switch). Null clears it.
        merchant:
          type: string
        purchaseDate:
          type: string
        deliveryDate:
          type: ["string", "null"]
          description: Delivery date (YYYY-MM-DD); null clears it.
        total:
          type: number
        currency:
          type: string
        category:
          type: string
        warranty:
          type: string
        isDraft:
          type: boolean
          description: Set to false to confirm a draft receipt into the library.
        notableItems:
          type: array
          items:
            $ref: "#/components/schemas/NotableItem"
    ReceiptStats:
      type: object
      required:
        - totalReceipts
        - totalSpend
        - merchantCount
        - thisMonthSpend
      properties:
        totalReceipts:
          type: integer
        totalSpend:
          type: number
        merchantCount:
          type: integer
        thisMonthSpend:
          type: number
        topCategory:
          type: ["string", "null"]
    MerchantSpend:
      type: object
      required:
        - merchant
        - total
        - count
      properties:
        merchant:
          type: string
        total:
          type: number
        count:
          type: integer
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        receiptId:
          type: integer
          description: For supporting attachments only; binds the upload to an existing owned receipt.
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    GuestClaimBody:
      type: object
      required:
        - guestToken
      properties:
        guestToken:
          type: string
          minLength: 1
          description: The guest session token to claim and migrate.
    SimilarReceiptMatch:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        merchant:
          type: ["string", "null"]
        purchaseDate:
          type: ["string", "null"]
          description: Purchase date in ISO format (YYYY-MM-DD).
        total:
          type: ["number", "null"]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    BillingAccessStatus:
      type: object
      required: [plan, trialEndAt, currentPeriodEnd, cancelAtPeriodEnd]
      properties:
        paymentAttention:
          type: boolean
          description: The existing Stripe subscription needs payment attention. Access is governed separately by canUseApp and currentPeriodEnd.
        accessState:
          type: string
          enum: [not_started, account_trial, trial_exhausted, trial_expired, legacy_stripe_trial, paid, owner, subscription_required]
        trialUploadsRemaining:
          type: [integer, "null"]
        trialUploadsUsed:
          type: integer
        foundingEligible:
          type: boolean
        canUpload:
          type: boolean
        canUseApp:
          type: boolean
        reviewReceiptId:
          type: [integer, "null"]
        plan:
          type: string
          enum: [free, trialing, pro]
        trialEndAt:
          type: [string, "null"]
        currentPeriodEnd:
          type: [string, "null"]
        cancelAtPeriodEnd:
          type: boolean
        ownerAccess:
          type: boolean
          description: Complimentary entitlement verified by the server, never supplied by the client.
        hasBillingAccount:
          type: boolean
          description: For complimentary owners, indicates an existing Stripe customer whose billing portal remains available.
