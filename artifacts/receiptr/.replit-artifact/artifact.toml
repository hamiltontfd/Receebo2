kind = "web"
previewPath = "/"
title = "Receebo"
version = "1.0.0"
id = "artifacts/receiptr"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/receiptr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/receiptr", "run", "build" ]
run = [ "node", "artifacts/receiptr/scripts/serve-public.mjs" ]

[services.env]
PORT = "5000"
BASE_PATH = "/"
